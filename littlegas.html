<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>小氣簿</title>
  
  <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/keliguru/sushiro-queue@main/littlegas-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="小氣簿">
  <meta property="og:description" content="小氣簿">
  <meta property="og:image" content="https://cdn.jsdelivr.net/gh/keliguru/sushiro-queue@main/littlegas-icon.png"> 
  <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/keliguru/sushiro-queue@main/littlegas-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小氣簿">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #FFF9E6;
      --card-bg: #FFFFFF;
      --border-color: #2B2D42;
      --primary: #FFD166;
      --secondary: #4ECDC4;
      --danger: #FF6B6B;
      --success: #2EC4B6;
      --radius: 22px;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--border-color);
      padding: 16px 12px 40px 12px;
      display: flex;
      justify-content: center;
    }
    
    /* 預設手機版容器 */
    .mobile-container {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    
    .header {
      text-align: center;
      padding: 10px 0 5px 0;
      width: 100%;
    }
    .header h1 {
      margin: 0;
      font-size: clamp(20px, 6vw, 26px);
      font-weight: 700;
      background: #FF6B6B;
      color: white;
      padding: 8px 18px;
      border-radius: 50px;
      border: 3.5px solid var(--border-color);
      box-shadow: 0 5px 0 var(--border-color);
      transform: rotate(-2deg);
      display: inline-block;
      max-width: 100%;
      word-break: break-word;
    }

    /* 電腦桌面端響應式調整 (寬度 >= 768px 時開啟雙欄) */
    @media (min-width: 768px) {
      .mobile-container {
        max-width: 960px;
      }
      .main-content {
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 20px;
        align-items: start;
      }
    }

    .cartoon-card {
      background: var(--card-bg);
      border: 3.5px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: 0 8px 0 var(--border-color);
      padding: 16px 14px;
      width: 100%;
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .total-banner {
      background: var(--secondary);
      border: 3.5px solid var(--border-color);
      border-radius: 18px;
      box-shadow: 0 5px 0 var(--border-color);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .total-banner.balance-banner {
      background: var(--primary);
      grid-column: span 2;
      align-items: center;
    }
    .total-title { font-size: 13px; font-weight: 700; }
    .total-amount { 
      font-size: 22px; 
      font-weight: 700; 
      color: white; 
      text-shadow: 2px 2px 0 var(--border-color);
      word-break: break-all;
    }
    .form-group { 
      margin-bottom: 12px; 
      width: 100%;
    }
    .form-group label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    .cartoon-input {
      width: 100%;
      height: 46px;
      padding: 8px 12px;
      font-size: 16px;
      font-family: inherit;
      font-weight: 700;
      color: var(--border-color);
      background-color: #F8FAFC;
      border: 3px solid var(--border-color);
      border-radius: 14px;
      outline: none;
      box-shadow: inset 0 3px 0 rgba(0,0,0,0.06);
      -webkit-appearance: none;
      appearance: none;
    }
    .cartoon-input:focus {
      background-color: #FFFFFF;
      border-color: #4C6EF5;
    }
    .calc-screen {
      text-align: right;
      font-size: 22px;
      background-color: #E8F5E9;
      color: #1B5E20;
      letter-spacing: 1px;
    }
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 6px;
      margin-bottom: 12px;
    }
    .calc-btn {
      height: 48px;
      font-size: 18px;
      font-family: inherit;
      font-weight: 700;
      color: var(--border-color);
      background-color: #FFFFFF;
      border: 3px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 4px 0 var(--border-color);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.05s ease;
      user-select: none;
    }
    .calc-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--border-color);
    }
    .calc-btn.op-btn { background-color: #E2E8F0; }
    .calc-btn.clear-btn { background-color: #FFD1D1; color: var(--danger); }
    .calc-btn.equal-btn { background-color: #A8DADC; }
    .btn-group { display: flex; gap: 8px; }
    .cartoon-btn {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      font-size: 18px;
      font-family: inherit;
      font-weight: 700;
      color: var(--border-color);
      background-color: var(--primary);
      border: 3.5px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 5px 0 var(--border-color);
      cursor: pointer;
      margin-top: 4px;
      transition: all 0.1s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .cartoon-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--border-color);
    }
    .cartoon-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .cartoon-btn.cancel-btn {
      background-color: #E2E8F0;
      flex: 0 0 75px;
    }

    .list-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .list-header { font-size: 18px; font-weight: 700; }
    
    .filter-btn-group {
      display: flex;
      gap: 4px;
      background: #F1F5F9;
      padding: 3px;
      border-radius: 12px;
      border: 2.5px solid var(--border-color);
    }
    .filter-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 700;
      color: var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-btn.active {
      background: var(--primary);
      box-shadow: 0 2px 0 var(--border-color);
    }

    .item-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .item-card {
      background: #FFFFFF;
      border: 3px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 4px 0 var(--border-color);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .item-info { 
      display: flex; 
      flex-direction: column; 
      gap: 2px; 
      min-width: 0; 
      width: 100%;
    }
    .item-category { font-size: 16px; font-weight: 700; word-break: break-word; }
    .item-meta { font-size: 12px; font-weight: 500; color: #64748B; word-break: break-word; }
    .item-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 2px dashed #E2E8F0;
      padding-top: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .item-amount-badge {
      background: #FFE3E3;
      color: var(--danger);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 3px 10px;
      font-size: 16px;
      font-weight: 700;
      word-break: break-all;
    }
    .item-amount-badge.income {
      background: #E8F5E9;
      color: #2E7D32;
    }
    .action-btns { 
      display: flex; 
      gap: 6px; 
      margin-left: auto;
    }
    .mini-btn {
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 5px 10px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--border-color);
      transition: all 0.1s;
    }
    .mini-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--border-color);
    }
    .edit-btn { background-color: #A8DADC; color: var(--border-color); }
    .delete-btn { background-color: #FF6B6B; color: white; }
    .loading-box { text-align: center; padding: 20px; font-weight: 700; color: #64748B; }
    
    .scroll-loader {
      text-align: center;
      padding: 14px;
      font-weight: 700;
      font-size: 14px;
      color: #64748B;
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 4px solid var(--border-color);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .cartoon-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: var(--border-color);
      color: #FFFFFF;
      padding: 12px 22px;
      border-radius: 50px;
      border: 3.5px solid var(--border-color);
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.25);
      font-size: 15px;
      font-weight: 700;
      z-index: 1000;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      white-space: nowrap;
    }
    .cartoon-toast.show { transform: translateX(-50%) translateY(0); }
    .cartoon-toast.error { background: var(--danger); }
    .cartoon-toast.success { background: var(--success); }
  </style>
</head>
<body>
<div class="mobile-container">
  
  <div class="header">
    <h1>✨ 小氣簿 📒</h1>
  </div>
  
  <!-- 包裹層：電腦螢幕下自動切換為雙欄 -->
  <div class="main-content">
    
    <!-- 左側：輸入表單與計算機 -->
    <div class="cartoon-card">
      <form id="expenseForm">
        <input type="hidden" id="editId" value="">
        
        <div class="form-group">
          <label for="date">📅 日期</label>
          <input type="date" id="date" class="cartoon-input" required>
        </div>
        <div class="form-group">
          <label for="category">🏷️ 項目/類別</label>
          <input type="text" id="category" class="cartoon-input" placeholder="不可不填" required>
        </div>
        <div class="form-group">
          <label for="note">📝 備註</label>
          <input type="text" id="note" class="cartoon-input" placeholder="可不填">
        </div>
        
        <div class="form-group">
          <label for="amount">🧮 金額 ($) <span style="font-size:12px;font-weight:500;color:#64748B;">正數=收入 負數=支出</span></label>
          <input type="text" id="amount" class="cartoon-input calc-screen" placeholder="0" readonly required>
        </div>
        
        <div class="calc-grid">
          <button type="button" class="calc-btn clear-btn" onclick="clearCalc()">C</button>
          <button type="button" class="calc-btn clear-btn" onclick="backspaceCalc()">⌫</button>
          <button type="button" class="calc-btn op-btn" onclick="appendCalc('÷')">÷</button>
          <button type="button" class="calc-btn op-btn" onclick="appendCalc('×')">×</button>
          <button type="button" class="calc-btn" onclick="appendCalc('7')">7</button>
          <button type="button" class="calc-btn" onclick="appendCalc('8')">8</button>
          <button type="button" class="calc-btn" onclick="appendCalc('9')">9</button>
          <button type="button" class="calc-btn op-btn" onclick="appendCalc('-')">-</button>
          <button type="button" class="calc-btn" onclick="appendCalc('4')">4</button>
          <button type="button" class="calc-btn" onclick="appendCalc('5')">5</button>
          <button type="button" class="calc-btn" onclick="appendCalc('6')">6</button>
          <button type="button" class="calc-btn op-btn" onclick="appendCalc('+')">+</button>
          <button type="button" class="calc-btn" onclick="appendCalc('1')">1</button>
          <button type="button" class="calc-btn" onclick="appendCalc('2')">2</button>
          <button type="button" class="calc-btn" onclick="appendCalc('3')">3</button>
          <button type="button" class="calc-btn equal-btn" onclick="evaluateCalc()">=</button>
          <button type="button" class="calc-btn" onclick="appendCalc('0')">0</button>
          <button type="button" class="calc-btn" onclick="appendCalc('00')">00</button>
          <button type="button" class="calc-btn" onclick="appendCalc('.')">.</button>
          <button type="button" class="calc-btn op-btn" onclick="toggleSign()">±</button>
        </div>
        <div class="btn-group">
          <button type="button" id="cancelEditBtn" class="cartoon-btn cancel-btn" style="display:none;" onclick="resetForm()">取消</button>
          <button type="submit" id="submitBtn" class="cartoon-btn">
            <span>➕ 新增一筆紀錄</span>
          </button>
        </div>
      </form>
    </div>
    
    <!-- 右側：總覽與歷史明細 -->
    <div class="cartoon-card">
      <div class="dashboard-grid">
        <div class="total-banner balance-banner">
          <span class="total-title">💰 當前總結餘</span>
          <span class="total-amount">$<span id="totalBalance">0</span></span>
        </div>
        <div class="total-banner" style="background-color: #4ECDC4;">
          <span class="total-title">🟢 累積收入</span>
          <span class="total-amount">$<span id="totalIncome">0</span></span>
        </div>
        <div class="total-banner" style="background-color: #FF6B6B;">
          <span class="total-title">🔴 累積支出</span>
          <span class="total-amount">$<span id="totalExpense">0</span></span>
        </div>
      </div>
      
      <div class="list-header-row">
        <div class="list-header">📜 歷史明細</div>
        <div class="filter-btn-group">
          <button type="button" class="filter-btn active" id="filter-all" onclick="setFilter('all')">全部</button>
          <button type="button" class="filter-btn" id="filter-income" onclick="setFilter('income')">🟢 收入</button>
          <button type="button" class="filter-btn" id="filter-expense" onclick="setFilter('expense')">🔴 支出</button>
        </div>
      </div>

      <div id="loading" class="loading-box">
        <div class="spinner"></div>
        <div>載入明細中...</div>
      </div>
      <ul id="itemList" class="item-list"></ul>
      
      <div id="scrollSentinel" class="scroll-loader">
        <span>⏳ 載入更多紀錄中...</span>
      </div>
    </div>

  </div>
</div>

<div id="toast" class="cartoon-toast"></div>

<script>
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyPAd8GJhMvHthq1NE8MTiAXN1_cHmbj-_Og9tPGn2dSKSj_qP9QjO-5wN3uGrS5Y_-/exec";
  
  let currentRecords = [];
  let sortedRecords = [];
  let currentFilter = 'all'; 
  
  const PAGE_SIZE = 5; 
  let currentPage = 0;
  let observer = null;

  let toastTimer = null;
  function showToast(msg, type = 'info') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'cartoon-toast show ' + type;
    
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.className = 'cartoon-toast';
    }, 2600);
  }

  function formatDateStr(rawDate) {
    if (!rawDate) return '';
    const d = new Date(rawDate);
    if (!isNaN(d.getTime())) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }
    return String(rawDate).substring(0, 10).replace(/\//g, '-');
  }

  function setTodayDate() {
    const today = new Date();
    document.getElementById('date').value = formatDateStr(today);
  }

  setTodayDate();
  document.addEventListener('DOMContentLoaded', fetchRecords);

  /* 計算機邏輯 */
  function appendCalc(val) {
    const amtInput = document.getElementById('amount');
    const ops = ['+', '-', '×', '÷'];
    const current = amtInput.value;
    if (current === '' && val === '-') { amtInput.value = '-'; return; }
    if ((current === '0' || current === '-0') && !ops.includes(val) && val !== '.') {
      amtInput.value = (current.startsWith('-') ? '-' : '') + val; return;
    }
    if (ops.includes(val) && ops.includes(current.slice(-1))) {
      amtInput.value = current.slice(0, -1) + val; return;
    }
    amtInput.value += val;
  }
  
  function clearCalc() { document.getElementById('amount').value = ''; }
  
  function backspaceCalc() {
    const amtInput = document.getElementById('amount');
    amtInput.value = amtInput.value.slice(0, -1);
  }
  
  function toggleSign() {
    const amtInput = document.getElementById('amount');
    let val = amtInput.value.trim();
    if (!val || val === '-' || val === '.') return;
    if (/^-?[0-9]*\.?[0-9]*$/.test(val)) {
      amtInput.value = val.startsWith('-') ? (val.slice(1) || '0') : ('-' + val);
      return;
    }
    evaluateCalc();
    val = amtInput.value.trim();
    if (val && /^-?[0-9]*\.?[0-9]*$/.test(val)) {
      amtInput.value = val.startsWith('-') ? (val.slice(1) || '0') : ('-' + val);
    }
  }
  
  function evaluateCalc() {
    const amtInput = document.getElementById('amount');
    let expr = amtInput.value.trim();
    if (!expr || expr === '-') return;
    expr = expr.replace(/×/g, '*').replace(/÷/g, '/');
    try {
      if (/^[0-9+\-*/. ]+$/.test(expr)) {
        let res = Function('"use strict"; return (' + expr + ')')();
        if (!isNaN(res) && isFinite(res)) {
          res = Math.round(res * 100) / 100;
          amtInput.value = res;
        }
      }
    } catch (err) { console.warn('計算錯誤:', err); }
  }

  /* 從 GAS 載入資料 */
  async function fetchRecords() {
    const loadingEl = document.getElementById('loading');
    const listEl = document.getElementById('itemList');
    hideSentinel();

    const cachedData = localStorage.getItem('expenseRecords');
    if (cachedData) {
      try {
        currentRecords = JSON.parse(cachedData);
        renderList(currentRecords);
        loadingEl.style.display = 'none'; 
      } catch(e) {
        console.warn("快取解析失敗", e);
        loadingEl.style.display = 'block';
      }
    } else {
      loadingEl.style.display = 'block'; 
      listEl.innerHTML = '';
    }

    try {
      const response = await fetch(`${GAS_WEB_APP_URL}?t=${Date.now()}`);
      const resData = await response.json();
      if (resData.status === 'success') {
        currentRecords = resData.data || [];
        localStorage.setItem('expenseRecords', JSON.stringify(currentRecords));
        renderList(currentRecords);
      } else {
        showToast('讀取失敗：' + (resData.message || '未知錯誤'), 'error');
      }
    } catch (err) {
      console.error(err);
      if (!cachedData) {
        showToast('連線失敗，請檢查網路。', 'error');
      }
    } finally {
      loadingEl.style.display = 'none';
    }
  }

  function setFilter(type) {
    currentFilter = type;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`filter-${type}`).classList.add('active');
    renderList(currentRecords);
  }

  function renderList(records) {
    const listEl = document.getElementById('itemList');
    listEl.innerHTML = '';

    if (!records || records.length === 0) {
      listEl.innerHTML = '<li class="loading-box">目前沒有記帳紀錄喔！🎈</li>';
      document.getElementById('totalBalance').textContent = '0';
      document.getElementById('totalIncome').textContent = '0';
      document.getElementById('totalExpense').textContent = '0';
      hideSentinel();
      return;
    }

    let totalIncome = 0;
    let totalExpense = 0;
    records.forEach(item => {
      const amt = parseFloat(item.amount) || 0;
      if (item.type === 'income') { totalIncome += amt; } else { totalExpense += amt; }
    });

    document.getElementById('totalIncome').textContent = totalIncome.toLocaleString();
    document.getElementById('totalExpense').textContent = totalExpense.toLocaleString();
    document.getElementById('totalBalance').textContent = (totalIncome - totalExpense).toLocaleString();

    let filtered = [...records].reverse();
    if (currentFilter !== 'all') {
      filtered = filtered.filter(item => item.type === currentFilter);
    }

    if (filtered.length === 0) {
      listEl.innerHTML = '<li class="loading-box">此分類下沒有紀錄喔！🔍</li>';
      hideSentinel();
      return;
    }

    sortedRecords = filtered;
    currentPage = 0;
    loadMoreRecords();
    setupObserver();
  }

  function loadMoreRecords() {
    const listEl = document.getElementById('itemList');
    const start = currentPage * PAGE_SIZE;
    const end = start + PAGE_SIZE;
    const chunk = sortedRecords.slice(start, end);

    chunk.forEach(item => {
      const amt = parseFloat(item.amount) || 0;
      const isIncome = item.type === 'income';
      const safeDate = formatDateStr(item.date);

      const li = document.createElement('li');
      li.className = 'item-card';
      li.innerHTML = `
        <div class="item-top">
          <div class="item-info">
            <div class="item-category">${isIncome ? '🟢' : '🔴'} ${escapeHtml(item.category)}</div>
            <div class="item-meta">🗓️ ${safeDate} ${item.note ? '• ' + escapeHtml(item.note) : ''}</div>
          </div>
        </div>
        <div class="item-bottom">
          <div class="item-amount-badge ${isIncome ? 'income' : ''}">
            ${isIncome ? '+' : '-'}$${amt.toLocaleString()}
          </div>
          <div class="action-btns">
            <button class="mini-btn edit-btn" onclick="startEdit('${item.id}')">✏️ 編輯</button>
            <button class="mini-btn delete-btn" onclick="deleteRecord('${item.id}')">🗑️ 刪除</button>
          </div>
        </div>
      `;
      listEl.appendChild(li);
    });

    currentPage++;

    if (currentPage * PAGE_SIZE < sortedRecords.length) { showSentinel(); } else { hideSentinel(); }
  }

  function setupObserver() {
    const sentinel = document.getElementById('scrollSentinel');
    if (observer) observer.disconnect();

    observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) {
        if (currentPage * PAGE_SIZE < sortedRecords.length) { loadMoreRecords(); }
      }
    }, { root: null, rootMargin: '100px', threshold: 0.1 });

    observer.observe(sentinel);
  }

  function showSentinel() {
    const sentinel = document.getElementById('scrollSentinel');
    if (sentinel) sentinel.style.display = 'block';
  }

  function hideSentinel() {
    const sentinel = document.getElementById('scrollSentinel');
    if (sentinel) sentinel.style.display = 'none';
  }

  function startEdit(id) {
    const item = currentRecords.find(r => String(r.id) === String(id));
    if (!item) return;
    document.getElementById('editId').value = item.id;
    document.getElementById('date').value = formatDateStr(item.date);
    document.getElementById('category').value = item.category;
    
    const amt = parseFloat(item.amount) || 0;
    document.getElementById('amount').value = (item.type === 'income') ? amt : -Math.abs(amt);
    document.getElementById('note').value = item.note || '';
    
    document.getElementById('submitBtn').innerHTML = '<span>💾 儲存修改</span>';
    document.getElementById('cancelEditBtn').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    showToast('✏️ 已載入資料，請修改', 'info');
  }

  function resetForm() {
    document.getElementById('editId').value = '';
    document.getElementById('category').value = '';
    document.getElementById('amount').value = '';
    document.getElementById('note').value = '';
    setTodayDate();
    document.getElementById('submitBtn').innerHTML = '<span>➕ 新增一筆紀錄</span>';
    document.getElementById('cancelEditBtn').style.display = 'none';
  }

  async function deleteRecord(id) {
    if (!confirm("確定要刪除這筆紀錄嗎？")) return;
    const payload = {
      action: 'delete',
      id: String(id)
    };
    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const resData = await response.json();
      if (resData.status === 'success') {
        showToast('🗑️ 成功刪除紀錄！', 'success');
        await fetchRecords();
      } else {
        showToast('刪除失敗：' + (resData.message || '未知錯誤'), 'error');
      }
    } catch (err) {
      console.error(err);
      showToast('刪除時發生錯誤', 'error');
    }
  }

  document.getElementById('expenseForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    evaluateCalc();
    const amtVal = document.getElementById('amount').value;
    const numAmt = parseFloat(amtVal);
    if (!amtVal || isNaN(numAmt) || numAmt === 0) {
      showToast('⚠️ 請先輸入有效金額（不可為 0）！', 'error');
      return;
    }
    
    const btn = document.getElementById('submitBtn');
    const editId = document.getElementById('editId').value;
    const isEdit = Boolean(editId);
    
    btn.disabled = true;
    btn.innerHTML = '<span>⏳ 處理中...</span>';
    
    const type = numAmt > 0 ? 'income' : 'expense';
    const amount = Math.abs(numAmt);
    
    const payload = {
      action: isEdit ? 'edit' : 'add',
      id: editId,
      type: type,
      date: document.getElementById('date').value,
      category: document.getElementById('category').value,
      amount: amount,
      note: document.getElementById('note').value
    };
    
    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const resData = await response.json();
      if (resData.status === 'success') {
        showToast(isEdit ? '💾 修改成功！' : '🎉 新增紀錄成功！', 'success');
        resetForm();
        await fetchRecords();
      } else {
        showToast('處理失敗：' + (resData.message || '未知錯誤'), 'error');
      }
    } catch (err) {
      console.error(err);
      showToast('操作失敗，請稍後再試', 'error');
    } finally {
      btn.disabled = false;
      if (!document.getElementById('editId').value) {
        document.getElementById('submitBtn').innerHTML = '<span>➕ 新增一筆紀錄</span>';
      } else {
        document.getElementById('submitBtn').innerHTML = '<span>💾 儲存修改</span>';
      }
    }
  });

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>
</body>
</html>
